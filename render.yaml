# Blueprint de Render para UN colegio.
#
# La arquitectura del sistema es una instalacion por colegio, asi que este
# archivo despliega una escuela: un servicio web y su propia base de datos.
# Para el segundo colegio se genera otro blueprint con nombres distintos:
#
#   ./scripts/nueva-escuela.sh --render colegio-vanguardia
#
# Los comandos de build y arranque de aqui abajo estan verificados: compilan,
# copian los estaticos junto al servidor standalone, aplican las migraciones y
# levantan el servidor.

services:
  - type: web
    name: sistema-escolar
    runtime: node
    # Oregon es la region de Render mas cercana a Mexico.
    region: oregon
    # OJO: el plan gratuito duerme el servicio tras unos minutos sin uso y la
    # base de datos gratuita caduca. Antes de cargar datos reales de un colegio
    # hay que subir ambos a un plan de paga.
    plan: free
    # La rama donde vive el codigo. Cambiala cuando lo integres a main.
    branch: claude/beautiful-mccarthy-hdfaaa
    buildCommand: >-
      npm ci &&
      npm run build &&
      cp -r public .next/standalone/ &&
      cp -r .next/static .next/standalone/.next/
    startCommand: ./scripts/arrancar.sh
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escuela-db
          property: connectionString
      # Render genera la clave de sesion y no la ve nadie mas.
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_HORAS
        value: "12"
      # No se fija NODE_ENV=production: npm omitiria las devDependencies y el
      # build necesita prisma, tailwindcss, postcss, autoprefixer y typescript,
      # que viven ahi. El servidor standalone ya se compila en modo produccion.
      #
      # Playwright solo se usa en las pruebas; sin esta bandera intentaria
      # descargar navegadores durante el build.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: NODE_VERSION
        value: "22"

databases:
  - name: escuela-db
    region: oregon
    plan: free
    databaseName: escuela
    user: escuela
